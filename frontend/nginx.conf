# Serves the SPA and reverse-proxies the API on the same origin, so session and CSRF cookies work
# without any cross-site configuration. This is the only container published to the outside.

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health of the web tier itself (container health check).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx is the edge: overwrite (never append) X-Forwarded-For so clients cannot spoof the address
        # the backend's rate limiter uses. Behind another proxy or load balancer, use the realip module.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # AI calls on a CPU may take up to the backend's AI timeout (60 s by default)
        proxy_read_timeout 90s;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is always revalidated, so a new deployment is picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
